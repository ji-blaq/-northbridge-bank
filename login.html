<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NorthBridge Bank | Secure Login</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="variables.css">
    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="utilities.css">
    <link rel="stylesheet" href="components.css">
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="responsive.css">

</head>

<body>

<main class="login">

    <!-- Background -->
    <div class="login__background"></div>

    <!-- Overlay -->
    <div class="login__overlay"></div>

    <!-- Content -->
    <section class="login__content">

        <!-- Brand -->
        <header class="brand">

            <div class="brand__logo">
                NB
            </div>

            <div>
                <h1>NorthBridge Bank</h1>
                <p>Banking Beyond Boundaries</p>
            </div>

        </header>

        <!-- Login Card -->
        <article class="login-card">

            <h2>Welcome Back</h2>

            <p>
                Securely sign in to access your banking dashboard.
            </p>

            <form id="loginForm">

    <!-- STEP 1 -->

    <div id="loginStep">

        <div class="input-group">

            <label for="email">

                Email Address

            </label>

            <input
                type="email"
                id="email"
                placeholder="john@northbridge.com"
                required>

        </div>


        <div class="input-group">

            <label for="password">

                Password

            </label>

            <input
                type="password"
                id="password"
                placeholder="••••••••"
                required>

        </div>


        <div class="login-options">

            <label>

                <input type="checkbox">

                Remember Me

            </label>

            <a href="#">

                Forgot Password?

            </a>

        </div>


        <button
            type="submit"
            class="btn btn-primary login-btn">

            Secure Sign In

        </button>

    </div>


    <!-- STEP 2 -->

    <div id="codeStep" style="display:none;">

        <div class="verification-header">

            <h3>Security Verification</h3>

            <p>

                Enter your unique security code to continue.

            </p>

        </div>


        <div class="input-group">

            <label for="uniqueCode">

                Unique Security Code

            </label>

            <input
                type="text"
                id="uniqueCode"
                placeholder="Enter your code"
                autocomplete="off">

        </div>


        <button
            type="button"
            id="verifyCodeBtn"
            class="btn btn-primary login-btn">

            Verify & Continue

        </button>


        <button
            type="button"
            id="backToLogin"
            class="back-login">

            ← Back to Login

        </button>

    </div>


    <p id="loginMessage"></p>

</form>

        </article>

    </section>

</main>

<!-- JavaScript -->
<script src="users.js"></script>
<script src="auth.js"></script>

</body>

</html>
